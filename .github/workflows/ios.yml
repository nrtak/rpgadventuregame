name: iOS build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle local game
        run: node ios/prepare-web.mjs
      - name: Generate Xcode project
        run: |
          swift ios/generate-icon.swift ios/Generated/Assets.xcassets/AppIcon.appiconset
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
      - name: Compile iPhone simulator app
        run: >-
          xcodebuild -project ios/RPGAdventureGame.xcodeproj
          -scheme RPGAdventureGame -configuration Release
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Launch game and verify touch interaction
        shell: bash
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for items in d["devices"].values() for x in items if "iPhone" in x["name"]))')
          xcodebuild -project ios/RPGAdventureGame.xcodeproj -scheme RPGAdventureGame -configuration Release -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build -resultBundlePath build/LaunchTest.xcresult CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iPhone-launch-test
          path: build/LaunchTest.xcresult
      - uses: actions/upload-artifact@v4
        with:
          name: RPGAdventureGame-simulator
          path: build/Build/Products/Release-iphonesimulator/RPGAdventureGame.app
          if-no-files-found: error
