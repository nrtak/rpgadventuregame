name: iOS build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle local game
        run: node ios/prepare-web.mjs
      - name: Generate Xcode project
        run: |
          swift ios/generate-icon.swift ios/Generated/Assets.xcassets/AppIcon.appiconset
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
      - name: Compile iPhone simulator app
        run: >-
          xcodebuild -project ios/RPGAdventureGame.xcodeproj
          -scheme RPGAdventureGame -configuration Release
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: RPGAdventureGame-simulator
          path: build/Build/Products/Release-iphonesimulator/RPGAdventureGame.app
          if-no-files-found: error
