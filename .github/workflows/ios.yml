name: iOS build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select App Store compatible Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle local game
        run: node ios/prepare-web.mjs
      - name: Generate Xcode project
        run: |
          swift ios/generate-icon.swift ios/Generated/Assets.xcassets/AppIcon.appiconset
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
      - name: Compile iPhone simulator app
        run: >-
          xcodebuild -project ios/RPGAdventureGame.xcodeproj
          -scheme RPGAdventureGame -configuration Release
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Launch game and verify touch interaction
        timeout-minutes: 10
        shell: bash
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); choices=[(runtime,x) for runtime,items in d["devices"].items() for x in items if "iPhone" in x["name"]]; choices.sort(key=lambda pair: "iOS-26" not in pair[0]); print(choices[0][1]["udid"])')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -project ios/RPGAdventureGame.xcodeproj -scheme RPGAdventureGame -configuration Release -destination "platform=iOS Simulator,id=$DEVICE" -destination-timeout 120 -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 -derivedDataPath build -resultBundlePath build/LaunchTest.xcresult CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iPhone-launch-test
          path: build/LaunchTest.xcresult
      - uses: actions/upload-artifact@v4
        with:
          name: RPGAdventureGame-simulator
          path: build/Build/Products/Release-iphonesimulator/RPGAdventureGame.app
          if-no-files-found: error
